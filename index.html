<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7c2d3f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Wine Blind"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Wine Blind — WSET</title></head><body>
<header class="app-header"><div><h1>Wine Blind</h1></div><button id="resetAll" class="ghost-btn">Réinitialiser</button></header>
<nav class="tabbar" aria-label="Navigation principale">
<button class="tab active" data-tab="grape" aria-label="Diagnostic cépage" title="Cépage">
<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="15" cy="8" r="3"/><circle cx="12" cy="13" r="3"/><circle cx="8" cy="14" r="3"/><circle cx="16" cy="14" r="3"/><circle cx="12" cy="19" r="3"/><path d="M12 5c1-3 3-3 5-3"/></svg><span class="nav-label">Cépage</span></button>
<button class="tab" data-tab="origin" aria-label="Diagnostic origine" title="Origine">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-13A7 7 0 1 0 5 9c0 6.8 7 13 7 13Z"/><circle cx="12" cy="9" r="2.5"/></svg><span class="nav-label">Origine</span></button>
<button class="tab" data-tab="training" aria-label="Mode entraînement" title="Entraînement">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v5a3 3 0 0 0 3 3h8"/><path d="m13 8 4 4-4 4"/><circle cx="5" cy="4" r="2"/><path d="M5 20v-3a3 3 0 0 1 3-3"/></svg><span class="nav-label">Entraînement</span></button>
<button class="tab" data-tab="history" aria-label="Historique" title="Historique">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.6"/><path d="M4 4v4.6h4.6"/><path d="M12 7v5l3 2"/></svg><span class="nav-label">Historique</span></button>
<button class="tab" data-tab="reference" aria-label="Référentiel" title="Référentiel">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A3.5 3.5 0 0 1 8.5 1H19v18H8.5A3.5 3.5 0 0 0 5 22.5Z"/><path d="M5 4.5V20"/><path d="M9 6h6M9 10h6"/></svg><span class="nav-label">Référentiel</span></button>
</nav>
<main>
<section id="tab-grape" class="screen active"><div class="segmented"><button id="typeRed" class="seg active">Rouge</button><button id="typeWhite" class="seg">Blanc</button></div><div class="form-card"><div class="card-title-row"><h2><span class="title-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 17h16M6 13h12M8 9h8M10 5h4"/></svg></span>Structure</h2><span id="diagnosticConfidence" class="confidence-badge">Confiance faible</span></div><div id="completionBar" class="completion"><span></span></div><div id="structureFields" class="fields"></div></div><div class="form-card"><div class="card-title-row"><h2><span class="title-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3c2.7 4.3 6 6.3 6 10a6 6 0 0 1-12 0c0-3.7 3.3-5.7 6-10Z"/><path d="M9 14c1.3 1.2 4.7 1.2 6 0"/></svg></span>Marqueurs complémentaires</h2></div><div id="markerFields" class="fields"></div></div><section class="results-section"><div class="section-heading"><div><span class="section-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 14.2 8.1 20 9l-4.2 4.1 1 5.8L12 16.2 7.2 19l1-5.8L4 9l5.8-.9L12 3Z"/></svg></span><h2>Top 10 cépages</h2></div><span id="grapeCount" class="muted"></span></div><div id="grapeResults" class="results compact-results"></div><div id="contextTools" class="context-tools hidden"><button id="nextCheck" class="context-pill next-check hidden" type="button"></button><button id="blendInsight" class="context-pill blend-insight hidden" type="button"></button></div><div id="comparePanel" class="compare-panel hidden"></div></section><div class="action-row"><button id="saveTasting" class="secondary-btn">Enregistrer</button><button id="goOrigin" class="primary-btn">Affiner l’origine →</button></div></section>
<section id="tab-origin" class="screen"><div id="inheritedSummary" class="inherited"></div><div class="form-card"><h2>Affiner le style</h2><div id="originFields" class="fields"></div></div><section class="results-section"><div class="section-heading"><div><span class="step">4</span><h2>Top 10 origines</h2></div></div><div id="originResults" class="results"></div></section><button id="saveTastingOrigin" class="primary-btn">Enregistrer cette dégustation</button></section>
<section id="tab-training" class="screen"><div class="segmented training-modes"><button id="modeTree" class="seg active">Arbre guidé</button><button id="modeQuiz" class="seg">Cas pratique</button></div><div id="treeMode"><div class="training-card"><div class="training-progress"><span id="treeStep"></span><button id="treeRestart" class="ghost-btn small">Recommencer</button></div><h2 id="treeQuestion"></h2><div id="treeOrientation" class="orientation hidden"></div><div class="yesno"><button id="treeYes" class="yes-btn">Oui</button><button id="treeNo" class="no-btn">Non</button></div><div id="treeTip" class="tree-tip"></div><button id="treeBack" class="link-btn">← Réponse précédente</button></div><div id="treeTrail" class="trail"></div></div><div id="quizMode" class="hidden"><div class="training-card"><div class="training-progress"><span>CAS PRATIQUE</span><button id="newQuiz" class="ghost-btn small">Nouveau</button></div><h2 id="quizQuestion">Identifie le cépage</h2><div id="quizClues" class="quiz-clues"></div><div id="quizChoices" class="quiz-choices"></div><div id="quizFeedback" class="quiz-feedback hidden"></div></div></div></section>
<section id="tab-history" class="screen"><div id="historyStats" class="stats-grid"></div><div id="historyInsights" class="history-insights"></div><div id="historyList" class="history-list"></div></section>
<section id="tab-reference" class="screen"><input id="searchGrape" class="search" type="search" placeholder="Cépage, appellation, région, arôme, assemblage…"><div class="ref-mode"><button class="ref-mode-btn active" data-refmode="grapes">Cépages</button><button class="ref-mode-btn" data-refmode="origins">Origines</button></div><div id="originCountryFilters" class="origin-country-filters hidden"></div><div class="ref-filters"><button class="filter-chip active" data-ref="all">Tous</button><button class="filter-chip" data-ref="Rouge">Rouges</button><button class="filter-chip" data-ref="Blanc">Blancs</button><button class="filter-chip" data-ref="fav">♡ À réviser</button></div><div class="reference-directory"><div id="referenceList" class="reference-list"></div><div id="alphaIndex" class="alpha-index" aria-label="Index alphabétique"></div></div></section>
</main>
<dialog id="detailDialog"><div class="dialog-head"><div><div id="detailType" class="eyebrow"></div><h2 id="detailTitle"></h2></div><button id="closeDialog" class="close-btn">×</button></div><div id="detailBody"></div></dialog>
<dialog id="saveDialog"><div class="dialog-head"><div><div class="eyebrow">Journal</div><h2>Enregistrer</h2></div><button id="closeSave" class="close-btn">×</button></div><form id="saveForm" class="save-form"><label>Vin / cuvée<input id="wineName" placeholder="Optionnel"></label><div class="two-col"><label>Millésime<input id="wineVintage" inputmode="numeric"></label><label>Date<input id="wineDate" type="date"></label></div><label>Cépage réel<input id="actualGrape" list="grapeNames" placeholder="Après révélation"></label><label>Origine réelle<input id="actualOrigin" placeholder="Optionnel"></label><label>Notes<textarea id="wineNotes" rows="3"></textarea></label><datalist id="grapeNames"></datalist><button class="primary-btn" type="submit">Enregistrer</button></form></dialog>
<script src="data.js"></script><script src="v106.js"></script><script src="v107.js"></script><script src="v108.js"></script><script src="tree.js"></script><script src="app.js"></script></body></html>
