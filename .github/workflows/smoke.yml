name: Wine Blind smoke

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check c2c2-engine.js
          node --check canonical-scoring-overlay.js
          node --check canonical-aroma-runtime.js
          node --check v11-reset-patch.js
          node --check app.js
          node --check sw.js
          node --check tests/mobile-browser.mjs
          node --check tests/mobile-endurance.mjs
      - name: Wine Blind regression smoke
        run: |
          node tests/smoke.mjs
          node tests/canonical-aroma-scoring.mjs
      - name: Install WebKit test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: iPhone WebKit navigation regression
        run: |
          python3 -m http.server 4173 >/tmp/wineblind-http.log 2>&1 &
          node tests/mobile-browser.mjs
          node tests/mobile-endurance.mjs
