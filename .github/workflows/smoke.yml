name: Wine Blind smoke

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check c2c2-engine.js
          node --check v11-reset-patch.js
          node --check app.js
          node --check sw.js
      - name: Wine Blind regression smoke
        run: node tests/smoke.mjs